name: coach_app
description: "Mini coach avatar - motivation, points, IA. Style Duolingo."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Persistence locale (profil, points, streak)
  shared_preferences: ^2.2.3

  # Notifications locales (rappels du coach)
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Variables d'environnement (.env)
  flutter_dotenv: ^5.1.0

  # Appels réseau vers une API IA (Claude, OpenAI, etc.)
  http: ^1.2.2

  # Animations pour l'avatar (respiration, sauts, etc.)
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
